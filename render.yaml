services:
  - type: web
    name: dynasty-report-cards-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GM_BUDGET_BACKEND
        value: redis
      - key: GM_UPSTASH_REST_URL
        sync: false
      - key: GM_UPSTASH_REST_TOKEN
        sync: false
      - key: GM_CHAT_SECRET
        sync: false
      - key: GM_CHAT_DAILY_USD_MICROS
        value: "5000000"
